<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KU ECE '26 | Batch Website</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --black: #f0faf2;
    --deep: #e8f5eb;
    --card-bg: rgba(255,255,255,0.85);
    --green: #2db85a;
    --green-bright: #39d97a;
    --green-dim: #1f8a42;
    --green-glow: rgba(45,184,90,0.18);
    --green-faint: rgba(45,184,90,0.07);
    --border: rgba(45,184,90,0.22);
    --text: #1a3d24;
    --muted: #3d7a52;
    --white: #0f2918;
    --offwhite: #1a3d24;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(45,184,90,0.012) 3px, rgba(45,184,90,0.012) 4px);
    pointer-events: none; z-index: 9998;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 58px;
    background: rgba(240,250,242,0.96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
  }
  .nav-logo { font-family: 'Orbitron', monospace; font-size: 0.95rem; color: var(--green); letter-spacing: 0.14em; text-shadow: 0 0 10px var(--green); }
  .nav-links { display: flex; gap: 1.8rem; list-style: none; }
  .nav-links a { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: #2d6e42; text-decoration: none; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--green); text-shadow: 0 0 8px var(--green); }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--green); }

  /* TICKER */
  .ticker-bar {
    position: fixed; top: 58px; left: 0; right: 0; z-index: 199;
    background: rgba(232,245,235,0.98);
    border-bottom: 1px solid var(--border);
    padding: 0.4rem 0; overflow: hidden;
    display: flex; align-items: center;
  }
  .ticker-label { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; background: var(--green); color: #020c06; font-weight: 700; padding: 0.25rem 0.7rem; letter-spacing: 0.1em; white-space: nowrap; flex-shrink: 0; margin-right: 1rem; text-transform: uppercase; }
  .ticker-track { overflow: hidden; flex: 1; }
  .ticker-inner { display: flex; white-space: nowrap; animation: tickerMove 35s linear infinite; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem; color: #1a3d24; letter-spacing: 0.06em; }
  .ticker-inner:hover { animation-play-state: paused; }
  .ticker-item { margin-right: 2.5rem; display: inline-flex; align-items: center; gap: 0.5rem; }
  .ticker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); display: inline-block; flex-shrink: 0; animation: dotPulse 1.5s ease-in-out infinite; }
  .ticker-id { color: var(--green); font-size: 0.65rem; }
  @keyframes dotPulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  @keyframes tickerMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* HERO */
  #home {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 110px 1.5rem 3rem;
    position: relative; overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0; z-index: 0;
    overflow: hidden;
  }
  .hero-bg-slide {
    position: absolute; inset: 0;
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
    min-height: 100vh;
    filter: brightness(0.72) saturate(0.8);
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  .hero-bg-slide.active { opacity: 1; }

  /* ACADEMIC MATERIALS SECTION */
  #academic-materials {
    padding: 80px 2rem;
    background: var(--deep);
    border-top: 1px solid var(--border);
  }
  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.8rem;
    color: var(--text);
    text-align: center;
    margin-bottom: 2.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .academic-container {
    max-width: 900px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
    box-shadow: 0 4px 20px var(--green-glow);
  }
  .year-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    color: var(--green-dim);
    border-bottom: 2px solid var(--green);
    padding-bottom: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .term-block {
    margin-left: 1rem;
    margin-bottom: 1.5rem;
  }
  .term-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--text);
    margin-bottom: 0.8rem;
  }
  .drive-links-list {
    list-style: none;
    margin-left: 1.5rem;
  }
  .drive-links-list li {
    margin-bottom: 0.5rem;
  }
  .drive-link {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    color: var(--green);
    text-decoration: none;
    font-weight: 600;
    background: var(--green-faint);
    padding: 0.3rem 0.8rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    transition: all 0.2s ease-in-out;
    display: inline-block;
  }
  .drive-link:hover {
    background: var(--green);
    color: #020c06;
    box-shadow: 0 0 10px var(--green);
  }
</style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-logo">KU ECE '26</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#academic-materials">Academic Materials</a></li>
    </ul>
  </nav>

  <!-- TICKER -->
  <div class="ticker-bar">
    <div class="ticker-label">Notice</div>
    <div class="ticker-track">
      <div class="ticker-inner">
        <div class="ticker-item"><span class="ticker-dot"></span> <span class="ticker-id">[ECE 26]</span> Drive links for 1st Year Materials updated.</div>
      </div>
    </div>
  </div>

  <!-- HERO -->
  <section id="home">
    <div class="hero-bg">
      <div class="hero-bg-slide active"></div>
    </div>
  </section>

  <!-- ACADEMIC MATERIALS SECTION -->
  <section id="academic-materials">
    <h2 class="section-title">Academic Materials</h2>
    <div class="academic-container">
      <h3 class="year-title">1st Year</h3>
      
      <!-- 1st Term -->
      <div class="term-block">
        <h4 class="term-title">1st Term</h4>
        <ul class="drive-links-list">
          <li>
            <a class="drive-link" href="https://drive.google.com/drive/folders/1mLzFvW0ADCqFX6Bn_bnCTHcEcX2hqCSG?usp=drive_link" target="_blank" rel="noopener noreferrer">ECE '26 Folder</a>
          </li>
          <li>
            <a class="drive-link" href="https://drive.google.com/drive/folders/1J7v1GlEV0hE-ORTu2s__Lc-WaePE_UnW?usp=drive_link" target="_blank" rel="noopener noreferrer">ECE '25 Folder</a>
          </li>
        </ul>
      </div>

      <!-- 2nd Term -->
      <div class="term-block">
        <h4 class="term-title">2nd Term</h4>
        <ul class="drive-links-list">
          <li>
            <a class="drive-link" href="https://drive.google.com/drive/folders/1IuMA--8c1Nnm-N3NLJjPZKZBzPAkMlGZ?usp=drive_link" target="_blank" rel="noopener noreferrer">ECE '26 Folder</a>
          </li>
          <li>
            <a class="drive-link" href="https://drive.google.com/drive/folders/1_1rklBkiN2-Kvk_aS8jsHuJnW7bIp4Cj?usp=drive_link" target="_blank" rel="noopener noreferrer">ECE '25 Folder</a>
          </li>
        </ul>
      </div>

    </div>
  </section>

</body>
</html>
